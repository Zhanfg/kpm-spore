name: PJZ110 BBRv3 KPM

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - modules/bbr3_pjz110/**
      - .github/workflows/bbr3-pjz110-kpm.yml
  push:
    branches:
      - feat/pjz110-bbr3-kpm
    paths:
      - modules/bbr3_pjz110/**
      - .github/workflows/bbr3-pjz110-kpm.yml

permissions:
  contents: read

concurrency:
  group: bbr3-pjz110-kpm-${{ github.ref }}
  cancel-in-progress: true

env:
  ONEPLUS_KERNEL_REPO: https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8750.git
  ONEPLUS_KERNEL_REV: e1b346b6b4f4096eb342ae3684838a942fd6f6c4

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install kernel build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc binutils-aarch64-linux-gnu bison build-essential clang-18 flex git \
            libelf-dev libssl-dev lld-18 llvm-18 pahole python3 rsync

      - name: Fetch pinned OnePlus kernel source
        shell: bash
        run: |
          set -euxo pipefail
          KERNEL="$GITHUB_WORKSPACE/.ci-kernel"
          git init "$KERNEL"
          git -C "$KERNEL" remote add origin "$ONEPLUS_KERNEL_REPO"
          git -C "$KERNEL" fetch --depth=1 origin "$ONEPLUS_KERNEL_REV"
          git -C "$KERNEL" checkout --detach FETCH_HEAD
          test "$(git -C "$KERNEL" rev-parse HEAD)" = "$ONEPLUS_KERNEL_REV"

      - name: Prepare PJZ110 kernel headers
        shell: bash
        run: |
          set -euxo pipefail
          KERNEL="$GITHUB_WORKSPACE/.ci-kernel"
          make -C "$KERNEL" ARCH=arm64 LLVM=-18 LLVM_IAS=1 gki_defconfig
          "$KERNEL/scripts/config" --file "$KERNEL/.config" \
            --set-str LOCALVERSION "-android15-8-o-4k" \
            --disable LOCALVERSION_AUTO \
            --enable MODULES \
            --enable TCP_CONG_ADVANCED \
            --enable TCP_CONG_BBR
          make -C "$KERNEL" ARCH=arm64 LLVM=-18 LLVM_IAS=1 olddefconfig
          make -C "$KERNEL" -j"$(nproc)" ARCH=arm64 LLVM=-18 LLVM_IAS=1 modules_prepare

      - name: Compile BBRv3 with OnePlus Kbuild
        shell: bash
        run: |
          set -euxo pipefail
          KERNEL="$GITHUB_WORKSPACE/.ci-kernel"
          MOD="$GITHUB_WORKSPACE/modules/bbr3_pjz110"

          # We intentionally allow modpost to warn about KernelPatch runtime
          # symbols; the deliverable is the pre-modpost relocatable object,
          # not the generated Linux .ko.
          make -C "$KERNEL" -j"$(nproc)" \
            ARCH=arm64 LLVM=-18 LLVM_IAS=1 \
            KBUILD_MODPOST_WARN=1 \
            M="$MOD" modules

          test -s "$MOD/bbr3_pjz110.o"
          mkdir -p build/bbr3_pjz110
          cp "$MOD/bbr3_pjz110.o" build/bbr3_pjz110/bbr3_pjz110.kpm

      - name: Strip and audit KPM
        shell: bash
        run: |
          set -euxo pipefail
          KPM=build/bbr3_pjz110/bbr3_pjz110.kpm
          STRIP=llvm-strip-18
          READELF=llvm-readelf-18
          NM=llvm-nm-18

          "$STRIP" -g --strip-unneeded --strip-debug \
            --remove-section=.comment \
            --remove-section=.note.GNU-stack \
            "$KPM"

          "$READELF" -h "$KPM" | tee bbr3-pjz110-elf.txt
          "$READELF" -S "$KPM" | tee bbr3-pjz110-sections.txt
          "$NM" -u "$KPM" | tee bbr3-pjz110-undefined.txt

          "$READELF" -h "$KPM" | grep -F 'REL (Relocatable file)'
          "$READELF" -h "$KPM" | grep -F 'AArch64'
          "$READELF" -S "$KPM" | grep -F '.kpm.info'
          "$READELF" -S "$KPM" | grep -F '.kpm.init'
          "$READELF" -S "$KPM" | grep -F '.kpm.exit'

          strings "$KPM" | grep -F 'name=kpm-bbr3-pjz110'
          strings "$KPM" | grep -F 'bbr3'

          # Registration must be dynamic through KernelPatch, never a static
          # KMI/module import as in the old KO path.
          ! "$NM" -u "$KPM" | awk '{print $NF}' | grep -qx 'tcp_register_congestion_control'
          ! "$NM" -u "$KPM" | awk '{print $NF}' | grep -qx 'tcp_unregister_congestion_control'

          # A KPM must not carry Linux module entry/refcount machinery.
          ! "$NM" "$KPM" | awk '{print $NF}' | grep -qx '__this_module'
          ! "$NM" "$KPM" | awk '{print $NF}' | grep -qx 'init_module'
          ! "$NM" "$KPM" | awk '{print $NF}' | grep -qx 'cleanup_module'

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp build/bbr3_pjz110/bbr3_pjz110.kpm dist/
          cp modules/bbr3_pjz110/README.md dist/
          cp bbr3-pjz110-elf.txt dist/
          cp bbr3-pjz110-sections.txt dist/
          cp bbr3-pjz110-undefined.txt dist/
          (cd dist && sha256sum bbr3_pjz110.kpm > bbr3_pjz110.kpm.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: pjz110-bbr3-kpm
          path: dist/
          if-no-files-found: error
          retention-days: 30
